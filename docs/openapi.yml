components:
  schemas:
    Address:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        label:
          type: string
          maxLength: 40
        full_name:
          type: string
          maxLength: 120
        phone:
          type: string
          maxLength: 20
        line1:
          type: string
          maxLength: 200
        line2:
          type: string
          maxLength: 200
        city:
          type: string
          maxLength: 80
        state:
          type: string
          maxLength: 80
        postal_code:
          type: string
          maxLength: 20
        country:
          type: string
          maxLength: 80
        is_default:
          type: boolean
      required:
      - city
      - created_at
      - full_name
      - id
      - line1
      - phone
      - postal_code
      - state
      - updated_at
    AddressRequest:
      type: object
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 40
        full_name:
          type: string
          minLength: 1
          maxLength: 120
        phone:
          type: string
          minLength: 1
          maxLength: 20
        line1:
          type: string
          minLength: 1
          maxLength: 200
        line2:
          type: string
          maxLength: 200
        city:
          type: string
          minLength: 1
          maxLength: 80
        state:
          type: string
          minLength: 1
          maxLength: 80
        postal_code:
          type: string
          minLength: 1
          maxLength: 20
        country:
          type: string
          minLength: 1
          maxLength: 80
        is_default:
          type: boolean
      required:
      - city
      - full_name
      - line1
      - phone
      - postal_code
      - state
    AuditLog:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        actor_email:
          type: string
          readOnly: true
          default: ''
        action:
          type: string
          maxLength: 120
        target:
          type: string
          maxLength: 160
        metadata: {}
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - actor_email
      - created_at
      - id
    Brand:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 120
        slug:
          type: string
          maxLength: 140
          pattern: ^[-a-zA-Z0-9_]+$
        logo:
          type: string
          format: uri
          nullable: true
      required:
      - id
      - name
    BrandRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        slug:
          type: string
          maxLength: 140
