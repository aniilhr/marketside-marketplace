  /api/auth/users/:
    get:
      operationId: auth_users_list
      parameters:
      - in: query
        name: is_active
        schema:
          type: boolean
      - in: query
        name: is_verified
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: role
        schema:
          type: string
          enum:
          - admin
          - customer
          - delivery
          - inventory
          - seller
        description: |-
          * `customer` - Customer
          * `seller` - Seller
          * `admin` - Admin
          * `inventory` - Inventory Manager
          * `delivery` - Delivery Partner
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
