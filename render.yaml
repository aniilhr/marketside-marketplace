# Render Blueprint. In the Render dashboard: New → Blueprint → pick this repo.
# It creates the API and the storefront in one go. Add DATABASE_URL yourself
# (from Neon or Supabase) so your database doesn't expire in 30 days.
services:
  - type: web
    name: marketside-api
    runtime: python
    plan: free
    region: singapore # oregon | frankfurt | singapore | ohio | virginia
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DJANGO_SECRET_KEY
        generateValue: true # Render generates a strong random value
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: USE_SQLITE
        value: "0"
      - key: CELERY_EAGER
        value: "1" # no Redis on free tier; tasks run inline
      - key: CORS_ALLOW_ALL
        value: "0"
      - key: TIME_ZONE
        value: Asia/Kolkata
      - key: DATABASE_URL
        sync: false # paste your Neon/Supabase connection string
      - key: CORS_ALLOWED_ORIGINS
        sync: false # https://marketside-web.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        sync: false # same value as above

  - type: web
    name: marketside-web
    runtime: static
    rootDir: frontend
    buildCommand: "npm ci && npm run build"
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false # https://marketside-api.onrender.com/api
    routes:
      - type: rewrite # single page app: every path serves index.html
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
